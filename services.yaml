# Who the night shift watches.
#
# Add an app:  copy a block, give it a unique lowercase id, paste the policy URLs.
#   type:      terms | privacy | cookies | ai | community | eula  (or any slug)
#   render:    true  -> page needs a real browser (content loads with JavaScript)
#   selector:  CSS selector for the policy text, only if auto-detection grabs junk
#
# Test a URL before adding it:  python -m nightshift check <url>

site:
  title: ToS Night Shift
  url: ""      # your public site, e.g. https://YOUR-USERNAME.github.io/tos-night-shift
  repo: ""     # your GitHub repo, e.g. https://github.com/YOUR-USERNAME/tos-night-shift
  branch: main

services:
  - id: google
    name: Google
    documents:
      - { type: terms, url: "https://policies.google.com/terms?hl=en" }
      - { type: privacy, url: "https://policies.google.com/privacy?hl=en" }

  - id: youtube
    name: YouTube
    documents:
      - { type: terms, url: "https://www.youtube.com/static?template=terms&hl=en" }

  - id: instagram
    name: Instagram
    documents:
      - { type: terms, url: "https://help.instagram.com/581066165581870", render: true }
      - { type: privacy, url: "https://privacycenter.instagram.com/policy", render: true }

  - id: facebook
    name: Facebook
    documents:
      - { type: terms, url: "https://www.facebook.com/terms.php", render: true }
      - { type: privacy, url: "https://www.facebook.com/privacy/policy/", render: true }

