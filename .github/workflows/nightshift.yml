name: Night shift

on:
  schedule:
    - cron: "17 2 * * *"   # every night at 02:17 UTC
  workflow_dispatch:         # "Run workflow" button for a manual shift

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"   # show progress in the log live

concurrency:
  group: nightshift
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q

      - name: Read every policy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          NIGHTSHIFT_MODEL: ${{ vars.NIGHTSHIFT_MODEL }}
        run: python -m nightshift run

      - name: Save what we caught
        run: |
          git config user.name  "night-shift-bot"
          git config user.email "night-shift-bot@users.noreply.github.com"
          git add snapshots data docs
          if git diff --cached --quiet; then
            echo "Quiet night. Nothing to commit."
          else
            git commit -m "night shift $(date -u +%Y-%m-%d)"
            git push
          fi
