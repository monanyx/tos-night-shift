name: AI summaries

# Rewrites keyword-only summaries with AI. Use it after adding or fixing your API key.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max summaries this run"
        required: false
        default: "100"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: nightshift
  cancel-in-progress: false

jobs:
  resummarize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rewrite summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          NIGHTSHIFT_MODEL: ${{ vars.NIGHTSHIFT_MODEL }}
          LIMIT: ${{ inputs.limit }}
        run: python -m nightshift resummarize --limit "$LIMIT"
      - name: Save
        run: |
          git config user.name  "night-shift-bot"
          git config user.email "night-shift-bot@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "AI summaries $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
